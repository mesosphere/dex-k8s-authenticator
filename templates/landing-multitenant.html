<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="google" content="notranslate">
    <meta http-equiv="Content-Language" content="en">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

    <title>{{ .Tenant_Name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{ .Web_Path_Prefix }}static/main.css" rel="stylesheet" type="text/css">
    <link href="{{ .Web_Path_Prefix }}static/styles.css" rel="stylesheet" type="text/css">
    <link rel="icon" href="{{ .Web_Path_Prefix }}static/favicon.png">
  </head>

  <body class="theme-body">
    <div class="theme-navbar">
      {{ if .Logo_Uri }}
      <div class="theme-navbar__logo-wrap">
          <img class="theme-navbar__logo" src="{{ .Logo_Uri }}"/>
      </div>
      {{ end }}
    </div>

    <div class="dex-container">

      <div class="theme-panel">
        <h2 class="theme-heading">{{ .Tenant_Name }}</h2>
          <div>

            <p>
              You can login to DKP management UI or generate Kubectl token.
            </p>

            <div class="theme-form-row">
              <a href="/dkp/kommander/dashboard/?tenant-id={{ .Tenant_Id }}" target="_self">
                <button class="dex-btn theme-btn-provider">
                  <span class="dex-btn-icon"></span>
                  <span class="dex-btn-text">Access DKP Dashboard</span>
                </button>
              </a>
            </div>

            <div class="theme-form-row">
              <a href="{{ .Web_Path_Prefix }}workspace/{{ .Tenant_Id }}" target="_self">
                <button class="dex-btn theme-btn-provider">
                  <span class="dex-btn-icon"></span>
                  <span class="dex-btn-text">Generate Kubectl Configuration</span>
                </button>
              </a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </body>
</html>
